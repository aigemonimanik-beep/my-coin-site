        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root {
            --bg-main: #071426; --bg-card: #122B45; --bg-sidebar: #091B30;
            --text-main: #F4F7FC; --text-muted: #A8B8CC; --border-color: #28415A;
            --accent-gold: #E8C779; --accent-gold-dark: #d4af37;
            --accent-cyan: #35D9F2; --success: #16C784; --error: #FF647C;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; margin: 0; padding: 0; }
        
        .glass-panel { background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); }
        .gold-text { background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Modern Buttons */
        .gold-btn { background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%); color: var(--bg-main); font-weight: 900; border: none; box-shadow: 0 4px 15px rgba(232, 199, 121, 0.3); transition: all 0.3s ease; cursor: pointer; }
        .gold-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232, 199, 121, 0.5); }
        .gold-btn:active:not(:disabled) { transform: scale(0.95); }
        
        .cyan-btn { background: linear-gradient(135deg, var(--accent-cyan) 0%, #1a9bb0 100%); color: var(--bg-main); font-weight: 900; box-shadow: 0 4px 15px rgba(53, 217, 242, 0.3); transition: all 0.3s ease; cursor: pointer; }
        .cyan-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(53, 217, 242, 0.5); }
        .cyan-btn:active:not(:disabled) { transform: scale(0.95); }

        .btn-modern-success { background: linear-gradient(135deg, #16C784 0%, #0e8c5d 100%); color: var(--bg-main); font-weight: 900; box-shadow: 0 4px 15px rgba(22, 199, 132, 0.3); transition: all 0.3s ease; }
        .btn-modern-success:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(22, 199, 132, 0.5); }
        .btn-modern-success:active { transform: scale(0.95); }

        .btn-modern-danger { background: linear-gradient(135deg, #FF647C 0%, #cc3d52 100%); color: white; font-weight: 900; box-shadow: 0 4px 15px rgba(255, 100, 124, 0.3); transition: all 0.3s ease; }
        .btn-modern-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 100, 124, 0.5); }
        .btn-modern-danger:active { transform: scale(0.95); }
        
        .input-premium { background: rgba(7, 20, 38, 0.5); border: 1px solid var(--border-color); color: var(--text-main); transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        .input-premium:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(53, 217, 242, 0.2); outline: none; }

        .status-badge.pending { background: rgba(53, 217, 242, 0.1); color: var(--accent-cyan); border: 1px solid rgba(53, 217, 242, 0.2); }
        .status-badge.processing { background: rgba(232, 199, 121, 0.1); color: var(--accent-gold); border: 1px solid rgba(232, 199, 121, 0.2); }
        .status-badge.approved { background: rgba(22, 199, 132, 0.1); color: var(--success); border: 1px solid rgba(22, 199, 132, 0.2); }
        .status-badge.rejected { background: rgba(255, 100, 124, 0.1); color: var(--error); border: 1px solid rgba(255, 100, 124, 0.2); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .marquee-container { overflow: hidden; white-space: nowrap; width: 100%; display: flex; align-items: center; }
        .marquee-content { display: inline-block; animation: marquee 15s linear infinite; padding-left: 100%; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        
        .active-coin { border: 2px solid var(--accent-gold) !important; box-shadow: 0 0 15px rgba(232, 199, 121, 0.3); background: rgba(232, 199, 121, 0.05); transform: scale(1.02); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .password-container { position: relative; }
        .password-toggle-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; transition: color 0.3s ease; }
        .password-toggle-icon:hover { color: var(--accent-cyan); }
        
        /* Profile Image Upload */
        .profile-img-wrap { position: relative; width: 80px; height: 80px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--accent-gold); box-shadow: 0 0 20px rgba(232,199,121,0.2); cursor: pointer; overflow: hidden; }
        .profile-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .profile-img-wrap .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .profile-img-wrap:hover .overlay { opacity: 1; }
    </style>

            adminTab: 'dash', adminSellTab: 'pending', adminWdTab: 'pending', editCoinId: null, 
            tempApproveId: null, activeTicketId: null, userSearchQuery: '',
            adminUserTab: 'info', activeManageUserId: null,
            editCoinTiers: [], adminOrderSearch: '', wdApproveId: null,
            adminHistoryType: null, userHistTab: 'sells', userOrderSearch: ''
        };

        let prevPendingCount = 0;
        const notifAudio = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3');

        // URL Check for Admin
        const isAdminUrl = window.location.href.includes('?admin') || window.location.href.includes('&admin');

        // ================= INSTANT LOAD (CACHE SYSTEM) =================
        let cacheData = localStorage.getItem('cb_cache');
        
        if (cacheData) {
            try {
                let parsed = JSON.parse(cacheData);
                settings = parsed.settings || DEFAULT_SETTINGS;
                coins = parsed.coins || [];
                pmMethods = parsed.pmMethods || [];
                orders = parsed.orders || [];
                dailyArchives = parsed.dailyArchives || [];
                notifications = parsed.notifications || [];
                tickets = parsed.tickets || [];
                users = parsed.users || []; 
                
                let isLogged = localStorage.getItem('cb_loggedIn') === 'true';

                if (isAdminUrl || isLogged) {
                    currentUser = parsed.currentUser || (isAdminUrl ? { id: 'admin-temp', name: 'Master Admin', username: 'admin', role: 'admin', balance: 0, status: 'active' } : null);
                    
                    if (isAdminUrl && currentUser) currentUser.role = 'admin';
                    
                    dataLoaded = !!currentUser;
                    
                    if(dataLoaded) {
                        document.addEventListener('DOMContentLoaded', () => {
                            document.getElementById('instant-routing').innerHTML = '';
                            document.getElementById('auth-wrapper').style.display = 'none'; 
                            document.getElementById('main-ui').style.display = 'flex';
                            
                            if (isAdminUrl) state.view = 'admin'; 
                            
                            updateMobileMenuProfile();
                            renderApp();
                        });
                    }
                }
            } catch(e) { console.error("Cache parsing error", e); }
        } else if (isAdminUrl) {
            currentUser = { id: 'admin-temp', name: 'Master Admin', username: 'admin', role: 'admin', balance: 0, status: 'active' };
            dataLoaded = true;
            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('instant-routing').innerHTML = '';
                document.getElementById('auth-wrapper').style.display = 'none'; 
                document.getElementById('main-ui').style.display = 'flex';
                state.view = 'admin'; 
                renderApp();
            });
        }

        function saveToLocalCache() {
            if(!currentUser) return;
            let cacheOrders = currentUser.role === 'admin' ? orders : orders.slice(0, 100); 
            let cacheUsers = currentUser.role === 'admin' ? users : [];
            let activeNotifs = notifications.slice(0, 50);
            
            let cache = { settings, coins, pmMethods, currentUser, orders: cacheOrders, dailyArchives, notifications: activeNotifs, tickets, users: cacheUsers };
            try {
                localStorage.setItem('cb_cache', JSON.stringify(cache));
            } catch(e) {
                console.warn("Storage cap reached for caching", e);
            }
        }

        function t(key) { return translations[settings.lang || 'bn'][key] || key; }
        function generateId(prefix) { return `${prefix}-${Math.random().toString(36).substring(2, 8).toUpperCase()}`; }
        
    </script>

    <script>
        // ================= PRE-AUTH SETUP & AUTO ADMIN LOGIC =================
        window.onload = () => {
            if (isAdminUrl) {
                document.getElementById('form-login').classList.add('hidden'); 
                document.getElementById('reg-link-text').style.display = 'none';
            }
        };

        function showLoading() { document.getElementById('auth-loading').style.display = 'flex'; }
        function hideLoading() { document.getElementById('auth-loading').style.display = 'none'; }

        async function autoLoginAdmin() {
            if(isAdminLoggingIn) return;
            isAdminLoggingIn = true;
            let adminEmail = "masteradmin2026@coinbazar.app";
            let adminPass = "MasterAdmin2026!@#";
            try {
                await auth.signInWithEmailAndPassword(adminEmail, adminPass);
                isAdminLoggingIn = false;
            } catch (e) {
                try {
                    let cred = await auth.createUserWithEmailAndPassword(adminEmail, adminPass);
                    await db.collection('cb_users').doc(cred.user.uid).set({
                        id: cred.user.uid, name: 'Master Admin', username: 'masteradmin2026', email: adminEmail,
                        tg: '', balance: 0, role: 'admin', status: 'active', profilePic: '',
                        createdAt: new Date().toLocaleString()
                    });
                    isAdminLoggingIn = false;
                } catch (err) {
                    isAdminLoggingIn = false;
                    switchAuth('login');
                }
            }
        }

        // ================= AUTHENTICATION & INITIALIZATION LOGIC =================
        function showToast(msg, type = 'success') {
            let t_el = document.getElementById('toast');
            t_el.innerText = msg;
            t_el.style.borderLeftColor = type === 'error' ? 'var(--error)' : 'var(--accent-cyan)';
            t_el.style.opacity = '1'; t_el.style.transform = 'translate(-50%, -10px)';
            setTimeout(() => { t_el.style.opacity = '0'; t_el.style.transform = 'translate(-50%, 0)'; }, 3000);
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); } 
            else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        let isRegistering = false;
        function switchAuth(type) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.add('hidden');
            if(type === 'login') { document.getElementById('form-login').classList.remove('hidden'); document.getElementById('auth-subtitle').innerText = isAdminUrl ? "Admin Portal Login" : "Login to your account"; }
            if(type === 'register') { document.getElementById('form-register').classList.remove('hidden'); document.getElementById('auth-subtitle').innerText = "Create a new account"; }
        }

        async function handleRegister() {
            if(isAdminUrl) return; 
            let name = document.getElementById('reg-name').value.trim();
            let username = document.getElementById('reg-username').value.trim().toLowerCase();
            let pass = document.getElementById('reg-pass').value;
            let cpass = document.getElementById('reg-cpass').value;

            if(!name || !username || !pass || !cpass) return showToast("সবগুলো তথ্য সঠিকভাবে দিন!", "error");
            if(/\s/.test(username)) return showToast("ইউজারনেমে কোনো স্পেস দেওয়া যাবে না!", "error");
            if(username.includes('@')) return showToast("ইউজারনেমে '@' বা স্পেশাল ক্যারেক্টার দেওয়া যাবে না!", "error");
            if(pass !== cpass) return showToast("পাসওয়ার্ড দুটি মিলেনি!", "error");
            if(pass.length < 6) return showToast("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।", "error");

            let email = username + "@coinbazar.app";

            showLoading();
            isRegistering = true;
            try {
                let cred = await auth.createUserWithEmailAndPassword(email, pass);
                let usersSnap = await db.collection('cb_users').get();
                let isFirstUser = usersSnap.empty;
                let role = isFirstUser ? 'admin' : 'user';

                await db.collection('cb_users').doc(cred.user.uid).set({
                    id: cred.user.uid, name: name, username: username, email: email,
                    tg: '', balance: 0, role: role, status: 'active', profilePic: '',
                    createdAt: new Date().toLocaleString()
                });
                
                await auth.signOut(); 
                isRegistering = false; hideLoading();
                showToast("অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে! দয়া করে লগইন করুন।", "success");
                switchAuth('login');
                document.getElementById('log-username').value = username;
                document.getElementById('log-pass').value = '';
            } catch (e) { 
                console.error("Reg Error:", e);
                isRegistering = false; hideLoading(); 
                let errorMsg = "অ্যাকাউন্ট তৈরি করতে সমস্যা হচ্ছে!";
                if (e.code === 'auth/email-already-in-use') errorMsg = "এই ইউজারনেইমটি ইতিমধ্যে ব্যবহার করা হয়েছে! অন্য একটি দিন।";
                else if (e.code === 'auth/invalid-email') errorMsg = "ইউজারনেমে কোনো স্পেশাল ক্যারেক্টার দেওয়া যাবে কেজি না!";
                showToast(errorMsg, "error"); 
            }
        }

        async function handleLogin() {
            let username = document.getElementById('log-username').value.trim().toLowerCase();
            let pass = document.getElementById('log-pass').value;
            if(!username || !pass) return showToast("ইউজারনেইম এবং পাসওয়ার্ড দিন!", "error");

        // --- Core Application Logic & Sync ---
        let unsubGlobal = null; let unsubUsers = null; let unsubOrders = null; let unsubTickets = null; let unsubNotifications = null;
        let initialNotifLoad = true; let lastNotifCount = 0;

        function startDataSync(user) {
            unsubGlobal = db.collection('cb_data').doc('global_state').onSnapshot(doc => {
                if (doc.exists) {
                    let data = doc.data();
                    settings = data.settings || DEFAULT_SETTINGS; 
                    
                    if(settings.maintenanceMode === true && isAdminUrl && currentUser && currentUser.role === 'admin') {
                        settings.maintenanceMode = false;
                        db.collection('cb_data').doc('global_state').update({ 'settings.maintenanceMode': false });
                    }

                    coins = data.coins || []; 
                    pmMethods = data.pmMethods || [];
                    // Ensure the 5 default payment methods exist if pmMethods is empty
                    if(pmMethods.length === 0) {
                        pmMethods = [
                            { id: 1, name: 'bKash', logo: '', charge: 0, active: true },
                            { id: 2, name: 'Nagad', logo: '', charge: 0, active: true },
                            { id: 3, name: 'Rocket', logo: '', charge: 0, active: true },
                            { id: 4, name: 'Upay', logo: '', charge: 0, active: true },
                            { id: 5, name: 'Binance', logo: '', charge: 0, active: true }
                        ];
                    }
                    dailyArchives = data.dailyArchives || [];
                    if(currentUser && dataLoaded) { renderApp(); saveToLocalCache(); }
                } else { db.collection('cb_data').doc('global_state').set({ settings: DEFAULT_SETTINGS, coins: [], pmMethods: [] }); }
            }, err => { console.log(err); });

            unsubUsers = db.collection('cb_users').onSnapshot(snap => {
                users = []; snap.forEach(d => users.push(d.data()));
                currentUser = users.find(u => u.id === user.uid);
                
                if(currentUser) {
                    dataLoaded = true; hideLoading();
                    updateMobileMenuProfile();
                    
                    // Clear instant routing override and display correctly
                    document.getElementById('instant-routing').innerHTML = '';
                    document.getElementById('auth-wrapper').style.display = 'none'; 
                    document.getElementById('main-ui').style.display = 'flex';
                    renderApp(); 
                    saveToLocalCache();
                } else { 
                    if(isAdminUrl) {
                        autoLoginAdmin(); 
                    } else {
                        localStorage.removeItem('cb_loggedIn');
                        localStorage.removeItem('cb_cache');
                        auth.signOut(); 
                    }
                }
            }, err => { showToast("Error loading user data", "error"); });

            unsubOrders = db.collection('cb_orders').onSnapshot(snap => {
                orders = []; snap.forEach(d => orders.push(d.data()));
                orders.sort((a,b) => new Date(b.time) - new Date(a.time));
                
                if(currentUser && currentUser.role === 'admin') {
                    let curPending = orders.filter(o => o.status === 'pending' || (o.type === 'wd' && o.status === 'processing')).length;
                    if(curPending > prevPendingCount) { 
                        playNotifSound(); 
                        showPushNotification("New Request Alert", "You have new pending requests!");
                    }
                    prevPendingCount = curPending;
                }
                if(currentUser && dataLoaded) { renderApp(); saveToLocalCache(); }
            }, err => console.log(err));

            unsubTickets = db.collection('cb_tickets').onSnapshot(snap => {
                tickets = []; snap.forEach(d => tickets.push(d.data()));
                if(currentUser && dataLoaded) { renderApp(); saveToLocalCache(); }
            }, err => console.log(err));

            unsubNotifications = db.collection('cb_notifications').onSnapshot(snap => {
                let newNotifs = []; snap.forEach(d => newNotifs.push(d.data()));
                newNotifs.sort((a,b) => new Date(b.time) - new Date(a.time));
                notifications = newNotifs;
                
                if(currentUser && dataLoaded) {
                    if(!initialNotifLoad) {
                        let latestNotif = notifications.find(n => n.userId === currentUser.id && !n.read);
                        if(latestNotif && notifications.length > lastNotifCount) showPushNotification(latestNotif.title, latestNotif.message);
                    }
                    lastNotifCount = notifications.length; initialNotifLoad = false;
                    updateNotifBadge(); renderApp(); saveToLocalCache();
                }
            }, err => console.log(err));
        }

        function stopDataSync() {
            if(unsubGlobal) unsubGlobal(); if(unsubUsers) unsubUsers(); if(unsubOrders) unsubOrders(); if(unsubTickets) unsubTickets(); if(unsubNotifications) unsubNotifications();
        }

        function exportCSV(type) {
            let data = [], filename = '';
            if(type === 'users') {
                filename = 'users_export.csv'; data = [['UID', 'Name', 'Username', 'Email', 'Balance', 'Role', 'Status', 'Join Date']];
                users.forEach(u => data.push([u.id, u.name, u.username, u.email, u.balance, u.role, u.status, u.createdAt||'']));
            } else if(type === 'sells') {
                filename = 'sells_export.csv'; data = [['Order ID', 'Telegram', 'User ID', 'Username', 'Coin', 'Amount(K)', 'Value', 'Paid', 'Status', 'Date']];
                orders.filter(o=>o.type==='sell').forEach(o => { let u = users.find(x=>x.id===o.userId); data.push([o.id, o.tgUsername||'', o.userId, u?u.username:'Unknown', o.coinName, o.k, o.receive, o.paidAmount||0, o.status, o.time]); });
            } else if(type === 'wds') {
                filename = 'withdraws_export.csv'; data = [['Order ID', 'User ID', 'Username', 'Method', 'Account', 'Amount', 'Charge', 'Status', 'Date']];
                orders.filter(o=>o.type==='wd').forEach(o => { let u = users.find(x=>x.id===o.userId); data.push([o.id, o.userId, u?u.username:'Unknown', o.methodName, o.acc, o.total, o.charge||0, o.status, o.time]); });
            }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + data.map(e => e.map(item => `"${item}"`).join(",")).join("\n");
            let encodedUri = encodeURI(csvContent); let link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", filename);
            document.body.appendChild(link); link.click(); document.body.removeChild(link); showToast(t('copied') + " (Exported)");
        }

        async function updateProfileDetails() {

            let uname = document.getElementById('prof-uname').value.trim().toLowerCase();
            if(!name || !uname) return showToast("Fields cannot be empty!", "error");

            showLoading();
            try {
                if (uname !== currentUser.username) {
                    const snap = await db.collection('cb_users').where('username', '==', uname).get();
                    if(!snap.empty) {
                        hideLoading();
                        return showToast("Username already taken!", "error");

                await db.collection('cb_users').doc(currentUser.id).update({ name: name, username: uname });

        async function updateUserPassword() {
            let currPass = document.getElementById('prof-curr-pass').value;
            let pass = document.getElementById('prof-pass').value; 
            let cpass = document.getElementById('prof-cpass').value;
            
            if(!currPass) return showToast("বর্তমান পাসওয়ার্ড দিতে হবে!", "error");
            if(!pass || !cpass) return showToast("Enter new password!", "error");
            if(pass !== cpass) return showToast("Passwords do not match!", "error");
            if(pass.length < 6) return showToast("At least 6 characters required!", "error");
            
            showLoading();
            try { 
                let cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, currPass);
                await auth.currentUser.reauthenticateWithCredential(cred);
                
                await auth.currentUser.updatePassword(pass); 
                document.getElementById('prof-curr-pass').value = '';
                document.getElementById('prof-pass').value = ''; 
                document.getElementById('prof-cpass').value = ''; 
                showToast("Password updated successfully!"); 
            } 
            catch(e) { 
                if(e.code === 'auth/wrong-password') showToast("বর্তমান পাসওয়ার্ড ভুল হয়েছে!", "error");

        // ================= USER HISTORY VIEW =================
        function renderUserHistory() {
            let resetTime = currentUser.resetTimestamp ? new Date(currentUser.resetTimestamp) : new Date(0);
            let allMyOrders = orders.filter(o => o.userId === currentUser.id);
            let visibleOrders = allMyOrders.filter(o => new Date(o.time) >= resetTime);

            let mySells = visibleOrders.filter(o => o.type === 'sell' && o.status === 'approved');
            let myWds = visibleOrders.filter(o => o.type === 'wd' && o.status === 'approved');
            let pendSells = visibleOrders.filter(o => o.type === 'sell' && o.status === 'pending');
            let pendWds = visibleOrders.filter(o => o.type === 'wd' && (o.status === 'pending' || o.status === 'processing'));

            let totalEarned = mySells.reduce((sum, o) => sum + (parseFloat(o.paidAmount) || parseFloat(o.receive)), 0);
            let totalSellCount = mySells.length;

            let totalWithdrawn = myWds.reduce((sum, o) => sum + parseFloat(o.total), 0);
            let totalWdCount = myWds.length;

            state.userHistTab = state.userHistTab || 'sells';
            
            // Search Filtering
            let q = (state.userOrderSearch || '').toLowerCase().trim();
            
            let filteredMySells = q ? mySells.filter(o => o.id.toLowerCase().includes(q)) : mySells;
            let filteredMyWds = q ? myWds.filter(o => o.id.toLowerCase().includes(q)) : myWds;
            let filteredPendSells = q ? pendSells.filter(o => o.id.toLowerCase().includes(q)) : pendSells;
            let filteredPendWds = q ? pendWds.filter(o => o.id.toLowerCase().includes(q)) : pendWds;

            let tabBtns = [

        async function resetUserHistory() {
            if(confirm(t('reset_confirm'))) {
                await db.collection('cb_users').doc(currentUser.id).update({
                    resetTimestamp: new Date().toISOString()
                });
                showToast("History Reset Successful!");
                renderApp();
            }
        }

        function exportUserCSV() {
            let resetTime = currentUser.resetTimestamp ? new Date(currentUser.resetTimestamp) : new Date(0);
            let myOrders = orders.filter(o => o.userId === currentUser.id && new Date(o.time) >= resetTime);
            if(myOrders.length === 0) return showToast("No data to export", "error");

            let data = [['Order ID', 'Type', 'Coin/Method', 'Amount/K', 'Value (BDT)', 'Status', 'Date']];
            myOrders.forEach(o => {
                let type = o.type === 'sell' ? 'Sell' : 'Withdraw';
                let item = o.type === 'sell' ? o.coinName : o.methodName;
                let amount = o.type === 'sell' ? o.k : o.total;
                let val = o.type === 'sell' ? (o.paidAmount || o.receive) : o.total;
                data.push([o.id, type, item, amount, val, o.status, o.time]);
            });

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + data.map(e => e.map(item => `"${item}"`).join(",")).join("\n");
            let encodedUri = encodeURI(csvContent); 
            let link = document.createElement("a"); 
            link.setAttribute("href", encodedUri); 
            link.setAttribute("download", `My_Transactions_${currentUser.username}.csv`);
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link); 
            showToast("File Downloaded!");
        }

        function copyText(txt) { navigator.clipboard.writeText(txt); showToast(t('copied')); }
        
        function calcSell() {
            if(!state.selCoinId) return;
            let k = parseFloat(document.getElementById('sell-k').value); let box = document.getElementById('sell-calc-box'); let btn = document.getElementById('sell-submit-btn');
            if(isNaN(k) || k <= 0) { box.classList.add('hidden'); btn.disabled = false; return; }
            let c = coins.find(x=>x.id===state.selCoinId);
            if(k < c.min || k > c.max) { let msg = k < c.min ? t('min_err') + c.min + "K" : t('max_err') + c.max + "K"; box.innerHTML = `<span class="text-[var(--error)]"><i class="fa-solid fa-circle-exclamation"></i> ${msg}</span>`; box.classList.remove('hidden'); btn.disabled = true; return; }
            
            let activePrice = c.price;
            let tierMatched = false;
            let matchedTierK = 0;
            // Exact calculation logic based on Highest matched Tier where user input K >= Tier K
            if(c.tiers && c.tiers.length > 0) {
                // Descending sort to match highest tier first (e.g. 50K matching before 10K if user enters 60)
                let sortedTiers = [...c.tiers].sort((a,b) => b.minK - a.minK); 
                let matched = sortedTiers.find(t => k >= t.minK);
                if(matched) { activePrice = matched.price; tierMatched = true; matchedTierK = matched.minK; }
            }
            
            let total = k * activePrice;
            let rateText = tierMatched ? `৳${activePrice} <span class="text-[8px] bg-[var(--accent-gold)] text-[var(--bg-main)] px-1 rounded ml-1 font-black">BULK (${matchedTierK}K+ RATE)</span>` : `৳${c.price}`;
            
            box.innerHTML = `<div class="flex items-center justify-center gap-2">${k}K × ${rateText}</div><div class="text-lg font-black text-[var(--accent-gold)] drop-shadow-md border-t border-[var(--border-color)] mt-1 pt-1">= ৳${total.toFixed(2)}</div>`; 
            box.classList.remove('hidden'); btn.disabled = false;
        }

        async function submitSell() {
            if(!state.selCoinId) return showToast("Select a coin first!", "error");
            let k = parseFloat(document.getElementById('sell-k').value); 
            
            let tg = '';
            if(settings.requireTelegram) {
                tg = document.getElementById('sell-tg-user').value.trim(); 
                if(!tg) return showToast(t('tg_req'), "error");
                if(!tg.startsWith('@')) return showToast(t('tg_err'), "error");
            }
            
            let fileInput = document.getElementById('sell-ss'); 
            let c = coins.find(x=>x.id===state.selCoinId);
            
            if(isNaN(k) || k<=0) return showToast("Enter a valid amount!", "error");
            if(k < c.min || k > c.max) return showToast("Invalid amount limit", "error");
            if(fileInput.files.length === 0) return showToast("Upload screenshot!", "error");
            
            showLoading();
            let ssData = null;
            try { ssData = await getBase64(fileInput.files[0]); } catch(e) {}
            
            let activePrice = c.price;
            if(c.tiers && c.tiers.length > 0) {
                let sortedTiers = [...c.tiers].sort((a,b) => b.minK - a.minK);
                let matched = sortedTiers.find(t => k >= t.minK);
                if(matched) { activePrice = matched.price; }
            }
            let receive = k * activePrice;
            
            let newOrder = { id: generateId('ORD'), type: 'sell', userId: currentUser.id, tgUsername: tg, coinId: c.id, coinName: c.name, k: k, receive: receive, userSs: ssData, status: 'pending', time: new Date().toLocaleString() };
            await db.collection('cb_orders').doc(newOrder.id).set(newOrder);
            state.selCoinId = null; 
            hideLoading();
            showToast("Order submitted successfully!"); 
            switchView('home');
        }

        function calcWd() {
            let box = document.getElementById('wd-calc-res'); if(!state.selWdId) return box.classList.add('hidden');
            let amt = parseFloat(document.getElementById('wd-amt').value); if(isNaN(amt) || amt <= 0) return box.classList.add('hidden');
            let m = pmMethods.find(x=>x.id===state.selWdId); 
            
            let isBinance = m.name.toLowerCase().includes('binance');
            let rate = settings.binanceRate || 127;
            let charge = isBinance ? 0 : (m.charge || 0); // No charge for Binance
            let receive = amt - charge; if(receive < 0) receive = 0;
            let isError = amt > currentUser.balance; let color = isError ? 'text-[var(--error)]' : 'text-white';
            let remaining = currentUser.balance - amt;
            
            let rateRow = isBinance ? `<div class="flex justify-between border-b border-[var(--border-color)] pb-1.5 pt-1.5"><span class="text-[10px] text-[var(--accent-cyan)]">ডলার রেট</span> <span class="text-white font-bold text-xs">৳${rate}</span></div>` : '';
            let chargeRow = isBinance ? '' : `<div class="flex justify-between border-b border-[var(--border-color)] pb-1.5 pt-1.5"><span class="text-[10px] text-[var(--text-muted)]" data-i18n="wd_chg">${t('wd_chg')}</span> <span class="text-[var(--error)] font-bold text-xs">- ৳${charge.toFixed(2)}</span></div>`;
            
            let rcvLabel = isBinance ? (settings.lang === 'en' ? 'Total Receive (USDT)' : 'মোট কত ডলার (USDT) পাবেন') : t('wd_rcv');
            let rcvHtml = isBinance ? `<span class="text-[var(--success)] font-black text-sm drop-shadow-sm">$${(receive / rate).toFixed(2)} USDT</span>` : `<span class="text-[var(--success)] font-black text-sm drop-shadow-sm">৳${receive.toFixed(2)}</span>`;
            
            box.innerHTML = `
                <div class="flex justify-between border-b border-[var(--border-color)] pb-1.5"><span class="text-[10px] text-[var(--text-muted)]" data-i18n="wd_cur_bal">${t('wd_cur_bal')}</span> <span class="text-white font-black text-xs">৳${currentUser.balance.toFixed(2)}</span></div>
                <div class="flex justify-between border-b border-[var(--border-color)] pb-1.5 pt-1.5"><span class="text-[10px] text-[var(--text-muted)]" data-i18n="wd_req_amt">${t('wd_req_amt')}</span> <span class="${color} font-black text-xs">৳${amt.toFixed(2)}</span></div>
                ${rateRow}
                ${chargeRow}
                <div class="flex justify-between border-b border-[var(--border-color)] pb-1.5 pt-1.5"><span class="text-[10px] text-[var(--success)] font-black">${rcvLabel}</span> ${rcvHtml}</div>
                <div class="flex justify-between pt-2"><span class="text-[10px] text-[var(--text-muted)] uppercase" data-i18n="wd_rem">${t('wd_rem')}</span> <span class="text-white font-black text-xs ${remaining < 0 ? 'text-[var(--error)]' : ''}">৳${remaining.toFixed(2)}</span></div>
            `;
            box.classList.remove('hidden');
        }
        
        async function submitWd() {
            if(!state.selWdId) return showToast("Select a payment method!", "error");
            let acc = document.getElementById('wd-acc').value.trim(); 
            let amt = parseFloat(document.getElementById('wd-amt').value);
            
            if(!acc || isNaN(amt) || amt <= 0) return showToast("Fill all valid details!", "error");
            let minL = settings.minWd || 50;
            if(amt < minL) return showToast(`Minimum withdraw is ৳${minL}!`, "error");
            if(amt > currentUser.balance) return showToast("Insufficient Balance!", "error");
            
            let m = pmMethods.find(x=>x.id===state.selWdId); 
            let isBinance = m.name.toLowerCase().includes('binance');
            
            if(!isBinance) {
                let isOnlyDigits = /^\d+$/.test(acc);
                if((acc.length !== 11 && acc.length !== 12) || !isOnlyDigits) return showToast("অবশ্যই ১১ বা ১২ সংখ্যার সঠিক নাম্বার দিতে হবে!", "error");
            }

            let charge = isBinance ? 0 : (m.charge || 0);
            let receive = amt - charge; 
            let receiveUsd = isBinance ? receive / (settings.binanceRate || 127) : null;
            
            await db.collection('cb_users').doc(currentUser.id).update({ balance: currentUser.balance - amt });
            let newWd = { id: generateId('WD'), type: 'wd', userId: currentUser.id, methodName: m.name, acc: acc, total: amt, receive: receive, receiveUsd: receiveUsd, charge: charge, status: 'pending', time: new Date().toLocaleString() };
            await db.collection('cb_orders').doc(newWd.id).set(newWd);
            closeWdModal(); showToast("Withdrawal requested!"); switchView('home');
        }

        function renderAdminDash() {
            let totalUsers = users.length; let totalBal = users.reduce((sum, u) => sum + (Number(u.balance)||0), 0);
            let totalSell = orders.filter(o=>o.type==='sell' && o.status==='approved').reduce((s,o)=>s+(parseFloat(o.paidAmount)||o.receive), 0);

            let wdPending = orders.filter(o => o.type === 'wd' && (o.status === 'pending' || o.status === 'processing')).length;

            let pendingBoardHtml = `
            <div class="glass-panel p-4 rounded-2xl mb-5 border-l-4 border-l-[var(--error)] shadow-[0_4px_15px_rgba(255,100,124,0.1)] flex justify-between items-center transition hover:shadow-lg">
                <div>
                    <h3 class="text-sm font-black text-white flex items-center gap-2"><i class="fa-solid fa-bell text-[var(--error)] animate-pulse"></i> Pending Requests</h3>
                    <p class="text-[10px] text-[var(--text-muted)] mt-1 font-bold">Sells: <span class="text-[var(--accent-cyan)]">${sellPending}</span> | Withdraws: <span class="text-[var(--accent-gold)]">${wdPending}</span></p>
                </div>
                <div class="bg-[var(--error)]/10 text-[var(--error)] text-xl font-black px-4 py-2 rounded-xl border border-[var(--error)]/30 drop-shadow-md">${totalPending}</div>

            let trackBoxHtml = `
            <div class="glass-panel p-4 rounded-2xl mb-5 shadow-sm border-t-2 border-[var(--accent-cyan)]">
                <h3 class="text-xs font-black text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-[var(--accent-cyan)]"></i> Track Order by ID</h3>
                <div class="flex gap-2">
                    <input type="text" id="admin-track-id" placeholder="Paste ID (e.g., ORD-XXXXXX or WD-XXXXXX)" class="w-full input-premium p-3 rounded-xl text-xs font-bold focus:border-[var(--accent-cyan)]">
                    <button onclick="trackOrderGlobal()" class="cyan-btn px-4 py-3 rounded-xl text-xs font-black shadow-sm flex items-center justify-center gap-2"><i class="fa-solid fa-search"></i></button>

            return pendingBoardHtml + trackBoxHtml + `

                </div>
                <h3 class="text-[10px] font-black text-[var(--text-muted)] uppercase mb-3 border-b border-[var(--border-color)] pb-1"><i class="fa-solid fa-file-csv text-[var(--accent-gold)]"></i> ${t('exp_data')}</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="openAdminHistory('users')" class="bg-gradient-to-br from-[var(--bg-sidebar)] to-[var(--bg-card)] border border-[var(--accent-cyan)]/40 text-[var(--accent-cyan)] py-3 rounded-xl text-[10px] font-black shadow-sm hover:shadow-[0_4px_15px_rgba(53,217,242,0.3)] hover:-translate-y-0.5 hover:bg-[var(--accent-cyan)] hover:text-white transition-all duration-300 active:scale-95 flex flex-col items-center justify-center"><i class="fa-solid fa-file-export block text-base mb-1.5"></i> Users</button>
                    <button onclick="openAdminHistory('sells')" class="bg-gradient-to-br from-[var(--bg-sidebar)] to-[var(--bg-card)] border border-[var(--success)]/40 text-[var(--success)] py-3 rounded-xl text-[10px] font-black shadow-sm hover:shadow-[0_4px_15px_rgba(22,199,132,0.3)] hover:-translate-y-0.5 hover:bg-[var(--success)] hover:text-white transition-all duration-300 active:scale-95 flex flex-col items-center justify-center"><i class="fa-solid fa-file-export block text-base mb-1.5"></i> Sells</button>

        // --- Admin History Modal & Delete Functions ---
        function openAdminHistory(type) {
            state.adminHistoryType = type;
            let title = type === 'users' ? 'All-Time Users History' : (type === 'sells' ? 'All-Time Sells History' : 'All-Time Withdraws History');
            document.getElementById('ahm-title').innerText = title;
            document.getElementById('ahm-search').value = '';
            document.getElementById('ahm-dl-btn').onclick = () => exportCSV(type);
            renderAdminHistoryList();
            document.getElementById('admin-history-modal').classList.remove('hidden');
        }
        
        function closeAdminHistory() {
            state.adminHistoryType = null;
            document.getElementById('admin-history-modal').classList.add('hidden');
        }

        async function deleteHistoryItem(id, type) {
            let msg = type === 'users' ? "আপনি কি নিশ্চিত যে এই ইউজারকে ডাটাবেস থেকে চিরতরে ডিলিট করতে চান?" : "আপনি কি নিশ্চিত যে এই ট্রানজেকশন হিস্ট্রি চিরতরে ডিলিট করতে চান?";
            if(!confirm(msg)) return;
            
            try {
                if(type === 'users') {
                    await db.collection('cb_users').doc(id).delete();
                    users = users.filter(u => u.id !== id); // update local instantly
                } else {
                    await db.collection('cb_orders').doc(id).delete();
                    orders = orders.filter(o => o.id !== id); // update local instantly
                }
                showToast("সফলভাবে ডিলিট করা হয়েছে!");
                renderAdminHistoryList(); // Update the list UI
                renderApp(); // Update dashboard counts
            } catch(e) {
                console.error(e);
                showToast("Error deleting data!", "error");
            }
        }

        function renderAdminHistoryList() {
            let searchInput = document.getElementById('ahm-search');
            if(!searchInput) return;
            let q = searchInput.value.toLowerCase().trim();
            let html = '';
            
            if (state.adminHistoryType === 'users') {
                let list = users;
                if(q) list = list.filter(u => (u.name||'').toLowerCase().includes(q) || (u.username||'').toLowerCase().includes(q) || (u.id||'').toLowerCase().includes(q));
                html = list.map(u => `
                    <div class="bg-[var(--bg-sidebar)] border border-[var(--border-color)] p-3 rounded-xl flex justify-between items-center hover:border-[var(--accent-cyan)]/30 transition">
                        <div>
                            <h4 class="text-xs font-black text-white">${u.name} <span class="text-[8px] bg-[var(--bg-main)] px-1 py-0.5 rounded border border-[var(--border-color)] text-[var(--text-muted)] ml-1">${u.role}</span></h4>
                            <p class="text-[9px] text-[var(--accent-cyan)] font-mono mb-1">@${u.username}</p>
                            <p class="text-[8px] text-[var(--text-muted)] font-mono bg-[var(--bg-main)] px-1 py-0.5 rounded inline-block">UID: ${u.id}</p>
                        </div>
                        <div class="text-right flex flex-col items-end gap-1">
                            <div class="text-xs font-black gold-text">৳${Number(u.balance||0).toFixed(2)}</div>
                            <div class="text-[8px] text-[var(--text-muted)]">${(u.createdAt||'N/A').split(',')[0]}</div>
                            <button onclick="deleteHistoryItem('${u.id}', 'users')" class="mt-1 text-[9px] bg-[var(--error)]/10 text-[var(--error)] border border-[var(--error)]/30 px-2.5 py-1 rounded hover:bg-[var(--error)] hover:text-white transition flex items-center gap-1.5 shadow-sm active:scale-90"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>`).join('');
            } else {
                let filterType = state.adminHistoryType === 'sells' ? 'sell' : 'wd';
                let list = orders.filter(o => o.type === filterType);
                if(q) list = list.filter(o => (o.tgUsername||'').toLowerCase().includes(q) || (o.acc||'').toLowerCase().includes(q) || (o.id||'').toLowerCase().includes(q));
                
                html = list.map(o => {
                    let u = users.find(x => x.id === o.userId);
                    let title = o.type === 'sell' ? `${o.k}K ${o.coinName}` : `${o.methodName}`;
                    let amt = o.type === 'sell' ? (o.paidAmount || o.receive) : o.total;
                    let color = o.type === 'sell' ? 'text-[var(--success)]' : 'text-[var(--error)]';
                    let sClass = `status-badge ${o.status}`;
                    return `
                    <div class="bg-[var(--bg-sidebar)] border border-[var(--border-color)] p-3 rounded-xl flex justify-between items-center hover:border-[var(--accent-cyan)]/30 transition">
                        <div>
                            <h4 class="text-[11px] font-black text-white">${u ? u.name : 'Unknown'}</h4>
                            <p class="text-[9px] text-[var(--text-muted)] mt-0.5">${title}</p>
                            <p class="text-[8px] text-[var(--text-muted)] font-mono bg-[var(--bg-main)] px-1 py-0.5 rounded inline-block mt-1">ID: ${o.id}</p>
                        </div>
                        <div class="text-right flex flex-col items-end gap-1">
                            <span class="font-black text-xs ${color}">৳${amt}</span>
                            <span class="${sClass} px-1.5 py-0.5 rounded text-[8px] font-black uppercase inline-block">${o.status}</span>
                            <span class="text-[7px] text-[var(--text-muted)]">${o.time}</span>
                            <button onclick="deleteHistoryItem('${o.id}', '${state.adminHistoryType}')" class="mt-1 text-[9px] bg-[var(--error)]/10 text-[var(--error)] border border-[var(--error)]/30 px-2.5 py-1 rounded hover:bg-[var(--error)] hover:text-white transition flex items-center gap-1.5 shadow-sm active:scale-90"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>`;
                }).join('');
            }
            if(!html) html = `<p class="text-center text-[var(--text-muted)] text-[10px] py-6 border border-dashed border-[var(--border-color)] rounded-xl">No records found.</p>`;
            document.getElementById('ahm-list').innerHTML = html;
        }

        function trackOrderGlobal() {
            let q = document.getElementById('admin-track-id').value.trim();
            if(!q) return showToast("Enter an Order ID", "error");
            let o = orders.find(x => x.id.toLowerCase() === q.toLowerCase() || x.id.toLowerCase().includes(q.toLowerCase()));
            if(!o) return showToast("Order not found!", "error");
            
            if(o.type === 'sell') {
                state.adminTab = 'sells';
                state.adminSellTab = o.status === 'pending' ? 'pending' : (o.status === 'approved' ? 'approved' : 'daily');
                if(o.status === 'rejected') state.adminSellTab = 'approved'; 
            } else {
                state.adminTab = 'wds';
                state.adminWdTab = (o.status === 'pending' || o.status === 'processing') ? 'pending' : (o.status === 'approved' ? 'approved' : 'rejected');
            }
            state.adminOrderSearch = q.toLowerCase();
            renderApp();
            showToast("Order Found & Selected!");
        }

        async function archiveDaily() {
            let todayOrders = orders.filter(o => o.type === 'sell' && o.status === 'approved' && !o.archived);
            if(todayOrders.length === 0) return showToast("Nothing to archive today!", "error");
            if(confirm("Are you sure? This will reset today's live summary and save it to history.")) {
                let sum = { date: new Date().toLocaleDateString(), totalK: 0, totalPaid: 0 };
                const batch = db.batch();
                todayOrders.forEach(o => { sum.totalK += o.k; sum.totalPaid += o.paidAmount; batch.update(db.collection('cb_orders').doc(o.id), {archived: true}); });
                let newArchive = [...dailyArchives]; newArchive.unshift(sum);
                await db.collection('cb_data').doc('global_state').update({ dailyArchives: newArchive });
                await batch.commit(); showToast("Summary Archived Successfully!");
            }
        }

        function closeApproveModal() { state.tempApproveId = null; document.getElementById('sell-approve-modal').classList.add('hidden'); }

            let amt = parseFloat(document.getElementById('sa-custom-amt').value); if(isNaN(amt) || amt < 0) return showToast("Invalid amount!", "error");
            let u = users.find(x=>x.id===o.userId);
            await db.collection('cb_users').doc(u.id).update({ balance: (Number(u.balance)||0) + amt });
            await db.collection('cb_orders').doc(o.id).update({ status: 'approved', paidAmount: amt });
            await addNotification(u.id, "Coin Sell Approved", `Added ৳${amt} to your balance for ${o.k}K ${o.coinName}.`, "success");
            closeApproveModal(); showToast(`Added ৳${amt}`);

        async function rejectSell(id) {

            await db.collection('cb_users').doc(u.id).update({ balance: (Number(u.balance)||0) + o.total });
            await db.collection('cb_orders').doc(o.id).update({ status: 'rejected' });

        async function toggleAdminRole(uid) {
            let u = users.find(x=>x.id===uid);
            let newRole = u.role === 'admin' ? 'user' : 'admin';
            if(confirm(`Are you sure you want to make this user an ${newRole.toUpperCase()}?`)) {
                await db.collection('cb_users').doc(u.id).update({ role: newRole });
                showToast(`User is now ${newRole}`);
                updateUserManageModal();
            }
        }

        async function toggleBlock(uid) { let u = users.find(x=>x.id===uid); await db.collection('cb_users').doc(u.id).update({ status: u.status === 'blocked' ? 'active' : 'blocked' }); showToast(`User status updated`); updateUserManageModal(); }
        async function modManualBal(uid, type) { 
            let amt = parseFloat(document.getElementById(`m-amt-${uid}`).value); if(isNaN(amt) || amt <= 0) return showToast("Invalid amount!", "error"); 
            let u = users.find(x=>x.id===uid); 
            if(type === 'add') { await db.collection('cb_users').doc(u.id).update({ balance: (Number(u.balance)||0) + amt }); } 
            else { if(amt > (Number(u.balance)||0)) return showToast("Not enough bal", "error"); await db.collection('cb_users').doc(u.id).update({ balance: (Number(u.balance)||0) - amt }); } 
            await addNotification(uid, "Balance Update", `${type==='add'?'Added':'Deducted'} ৳${amt} from balance.`, "info"); 
            showToast("Balance Updated"); updateUserManageModal();
        }

            if(state.activeTicketId) return renderActiveTicket(state.activeTicketId, 'admin');

                let u = users.find(x => x.id === tk.userId) || { name: tk.userName, username: 'unknown', profilePic: '' };
                let dp = u.profilePic || `https://placehold.co/100x100/122B45/35D9F2?text=${u.name.substring(0,1).toUpperCase()}`;
                let badge = tk.status === 'open' ? `<span class="bg-[var(--accent-cyan)]/20 text-[var(--accent-cyan)] px-2 py-0.5 rounded text-[9px] font-black uppercase border border-[var(--accent-cyan)]/30 shadow-sm animate-pulse">New Msg</span>` : '';
                let lastMsg = tk.messages.length > 0 ? tk.messages[tk.messages.length-1].text : '...';
                
                return `
                <div onclick="state.activeTicketId='${tk.id}'; renderApp()" class="glass-panel p-3 rounded-xl mb-3 cursor-pointer hover:border-[var(--accent-cyan)] transition flex items-center gap-3 shadow-sm hover:-translate-y-0.5">

                        <!-- Facebook -->
                        <div class="bg-[var(--bg-sidebar)] p-3 rounded-lg border border-[var(--border-color)]">
                            <div class="flex justify-between items-center mb-2"><label class="text-[10px] font-bold text-[#1877F2]"><i class="fa-brands fa-facebook text-sm mr-1"></i> Facebook Link</label> <input type="file" id="set-fb-logo" accept="image/*" class="text-[8px] text-[var(--text-muted)] w-[120px]"></div>
                            <input type="text" id="set-fb" value="${settings.fb || ''}" placeholder="https://facebook.com/..." class="w-full input-premium p-2.5 rounded-xl text-[11px] focus:border-[#1877F2]">
                        </div>
                        <!-- YouTube -->
                        <div class="bg-[var(--bg-sidebar)] p-3 rounded-lg border border-[var(--border-color)]">
                            <div class="flex justify-between items-center mb-2"><label class="text-[10px] font-bold text-[#FF0000]"><i class="fa-brands fa-youtube text-sm mr-1"></i> YouTube Channel Link</label> <input type="file" id="set-yt-logo" accept="image/*" class="text-[8px] text-[var(--text-muted)] w-[120px]"></div>
                            <input type="text" id="set-yt" value="${settings.yt || ''}" placeholder="https://youtube.com/..." class="w-full input-premium p-2.5 rounded-xl text-[11px] focus:border-[#FF0000]">
                        </div>
                        <button onclick="saveSocialLinks()" class="w-full gold-btn py-3.5 rounded-xl mt-1 text-[11px] font-black uppercase tracking-widest shadow-sm"><i class="fa-solid fa-floppy-disk"></i> ${t('save')}</button>
                    </div>
                </div>
                <!-- Coins Setup -->
                <div><h3 class="text-[10px] font-black text-[var(--text-muted)] mb-3 uppercase border-b border-[var(--border-color)] pb-2 flex items-center gap-2" data-i18n="coin_set"><i class="fa-brands fa-bitcoin"></i> ${t('coin_set')}</h3>${cForm}${cList}</div>
                <!-- Withdraw PMs -->
                <div>
                    <h3 class="text-[10px] font-black text-[var(--text-muted)] mb-3 uppercase border-b border-[var(--border-color)] pb-2 flex items-center gap-2"><i class="fa-solid fa-money-bill-transfer"></i> ${t('wd_limits')}</h3>
                    <div class="glass-panel p-4 rounded-xl shadow-sm mb-4">
                        <div class="grid grid-cols-2 gap-3 mb-4 pb-4 border-b border-[var(--border-color)]">
                            <div>
                                <label class="text-[9px] font-bold text-[var(--text-muted)] block uppercase mb-1.5">${t('min_wd')}</label>
                                <input type="number" id="set-min-wd" value="${settings.minWd || 50}" class="w-full input-premium p-2.5 rounded-lg text-xs font-black text-center focus:border-[var(--accent-gold)]">
                            </div>
                            <div>
                                <label class="text-[9px] font-bold text-[var(--text-muted)] block uppercase mb-1.5">Binance Rate</label>
                                <input type="number" id="set-binance-rate" value="${settings.binanceRate || 127}" placeholder="127" class="w-full input-premium p-2.5 rounded-lg text-xs font-black text-center focus:border-[var(--success)]">
                            </div>
                            <div class="col-span-2">
                                <label class="text-[9px] font-bold text-[var(--text-muted)] block uppercase mb-1.5">${t('wd_notice')}</label>
                                <input type="text" id="set-wd-notice" value="${settings.wdNotice || 'সর্বনিম্ন উত্তোলন ৫০ টাকা। সঠিক নাম্বার দিন।'}" placeholder="Important notice..." class="w-full input-premium p-2.5 rounded-lg text-xs font-bold focus:border-[var(--accent-cyan)]">
                            </div>
                        </div>
                        <h4 class="text-[10px] font-black text-[var(--text-muted)] mb-3 flex items-center gap-2"><i class="fa-solid fa-toggle-on text-[var(--success)]"></i> ${t('en_dis')}</h4>
                        ${pmListHtml}
                        <button onclick="savePmSettings()" class="w-full btn-modern-success py-3.5 rounded-xl mt-4 text-[11px] font-black uppercase tracking-widest shadow-sm"><i class="fa-solid fa-floppy-disk"></i> ${t('save_setup')}</button>
                    </div>
                </div>
            </div>`;
        }
        
        function addCoinTier() {
            let m = parseFloat(document.getElementById('t-min').value);
            let p = parseFloat(document.getElementById('t-price').value);
            if(isNaN(m) || isNaN(p) || m<=0 || p<=0) return showToast("Enter valid tier data!", "error");
            state.editCoinTiers.push({ minK: m, price: p });
            renderApp();
        }
        function removeCoinTier(idx) { state.editCoinTiers.splice(idx, 1); renderApp(); }

        async function toggleMaintenance(val) { settings.maintenanceMode = val; await db.collection('cb_data').doc('global_state').update({ 'settings.maintenanceMode': val }); showToast(val ? "Maintenance Mode ON" : "Maintenance Mode OFF"); }
        async function toggleReqTg(val) { settings.requireTelegram = val; await db.collection('cb_data').doc('global_state').update({ 'settings.requireTelegram': val }); showToast(val ? "Telegram Required: ON" : "Telegram Required: OFF"); }

        async function saveSiteIdentity() { settings.name = document.getElementById('set-name').value; settings.notice = document.getElementById('set-notice').value; let logoInput = document.getElementById('set-logo'); if(logoInput.files.length > 0) settings.logo = await getBase64(logoInput.files[0]); await db.collection('cb_data').doc('global_state').update({ 'settings': settings }); showToast("Site Identity Saved!"); }
        
        async function saveSocialLinks() { 
            settings.wa = document.getElementById('set-wa').value; 
            settings.tg = document.getElementById('set-tg').value; 
            settings.fb = document.getElementById('set-fb').value; 
            settings.yt = document.getElementById('set-yt').value; 
            
            let files = ['wa', 'tg', 'fb', 'yt'];
            showLoading();
            for(let f of files) {
                let input = document.getElementById(`set-${f}-logo`);
                if(input && input.files.length > 0) {
                    try { settings[`${f}Logo`] = await getBase64(input.files[0]); } catch(e){}
                }
            }
            await db.collection('cb_data').doc('global_state').update({ 'settings': settings }); 
            hideLoading();
            showToast("Social Links & Logos Saved!"); 
        }

        async function saveFaqSettings() {
            settings.videoUrl = document.getElementById('set-vid').value;
            settings.faq1_q = document.getElementById('set-fq1').value; settings.faq1_a = document.getElementById('set-fa1').value;
            settings.faq2_q = document.getElementById('set-fq2').value; settings.faq2_a = document.getElementById('set-fa2').value;
            await db.collection('cb_data').doc('global_state').update({ 'settings': settings }); showToast("FAQ Settings Saved!");
        }

        async function saveCoin() {
            let n = document.getElementById('c-name').value; let u = document.getElementById('c-uname').value;
            let p = parseFloat(document.getElementById('c-price').value); let min = parseFloat(document.getElementById('c-min').value); let max = parseFloat(document.getElementById('c-max').value);
            let active = document.getElementById('c-active').checked;
            if(!n || !u || isNaN(p) || isNaN(min) || isNaN(max)) return showToast("Fill all details!", "error");
            let logo = state.editCoinId ? coins.find(x=>x.id===state.editCoinId).logo : '';
            let f = document.getElementById('c-logo'); if(f.files.length > 0) logo = await getBase64(f.files[0]);
            let newCoins = [...coins];
            if(state.editCoinId) { let index = newCoins.findIndex(x=>x.id===state.editCoinId); newCoins[index] = { ...newCoins[index], name:n, username:u, price:p, min:min, max:max, tiers: state.editCoinTiers, logo:logo, active:active }; state.editCoinId = null; } 
            else { newCoins.push({ id: Date.now(), name: n, username: u, price: p, min: min, max: max, tiers: state.editCoinTiers, logo: logo, active: active }); }
            state.editCoinTiers = [];
            await db.collection('cb_data').doc('global_state').update({ 'coins': newCoins }); showToast("Coin Saved!");
        }
        function editCoin(id) { state.editCoinId = id; let c = coins.find(x=>x.id===id); state.editCoinTiers = c.tiers ? [...c.tiers] : []; renderApp(); }
        async function delCoin(id) { let newCoins = coins.filter(x=>x.id!==id); await db.collection('cb_data').doc('global_state').update({ 'coins': newCoins }); }
        
        async function updatePmLogo(id, input) {
            if(input.files && input.files[0]) {
                showLoading();
                try {
                    let base64 = await getBase64(input.files[0]);
                    let newPm = pmMethods.map(m => m.id === id ? {...m, logo: base64} : m);
                    await db.collection('cb_data').doc('global_state').update({ 'pmMethods': newPm });
                    showToast("Logo Updated!");
                } catch(e) { showToast("Upload failed", "error"); }
                hideLoading();
            }
        }

        async function savePmSettings() {
            let minWd = parseFloat(document.getElementById('set-min-wd').value) || 0;
            let binanceRate = parseFloat(document.getElementById('set-binance-rate').value) || 127;
            let wdNotice = document.getElementById('set-wd-notice').value;
            
            let newPm = pmMethods.map(m => {
                let isActive = document.getElementById(`pm-act-${m.id}`).checked;
                let charge = 0;
                if(!m.name.toLowerCase().includes('binance')) {
                    let cVal = document.getElementById(`pm-chg-${m.id}`).value;
                    charge = parseFloat(cVal) || 0;
                }
                return { ...m, active: isActive, charge: charge };
            });
            
            settings.minWd = minWd;
            settings.binanceRate = binanceRate;
            settings.wdNotice = wdNotice;
            
            await db.collection('cb_data').doc('global_state').update({ 
                'pmMethods': newPm,
                'settings': settings
            });
            showToast("Withdraw Setup Saved!");
        }

        function getBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => resolve(reader.result); reader.onerror = error => reject(error); }); }
        
        function renderFaq() {
            return `<div class="mb-4 flex items-center justify-between"><button onclick="switchView('home')" class="text-[var(--text-muted)] hover:text-white transition bg-[var(--bg-sidebar)] px-3 py-1.5 rounded-lg border border-[var(--border-color)] text-xs font-bold active:scale-95"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="back">${t('back')}</span></button><h2 class="text-lg font-black text-white"><i class="fa-solid fa-circle-question text-[var(--success)]"></i> <span data-i18n="help">${t('help')}</span></h2></div><div class="glass-panel rounded-2xl p-4 mb-6 shadow-md"><h3 class="font-black text-sm text-[var(--accent-gold)] mb-3 flex items-center gap-2"><i class="fa-brands fa-youtube text-red-500 text-lg"></i> <span data-i18n="vid_tut">${t('vid_tut')}</span></h3><div class="video-container border border-[var(--border-color)] shadow-inner"><iframe src="${settings.videoUrl}" frameborder="0" allowfullscreen></iframe></div></div><div class="glass-panel rounded-2xl p-4 mb-6 shadow-md"><h3 class="font-black text-sm text-[var(--accent-cyan)] mb-4 flex items-center gap-2"><i class="fa-solid fa-clipboard-list"></i> <span data-i18n="faq">${t('faq')}</span></h3><div class="space-y-4">${settings.faq1_q ? `<div class="bg-[var(--bg-sidebar)] p-3.5 rounded-xl border border-[var(--border-color)] shadow-sm hover:border-[var(--accent-cyan)]/30 transition"><h4 class="text-xs font-black text-white mb-2 border-b border-[var(--border-color)] pb-1.5">Q: ${settings.faq1_q}</h4><p class="text-[11px] text-[var(--text-muted)] leading-relaxed"><span class="text-[var(--success)] font-black mr-1">A:</span> ${settings.faq1_a}</p></div>` : ''}${settings.faq2_q ? `<div class="bg-[var(--bg-sidebar)] p-3.5 rounded-xl border border-[var(--border-color)] shadow-sm hover:border-[var(--accent-cyan)]/30 transition"><h4 class="text-xs font-black text-white mb-2 border-b border-[var(--border-color)] pb-1.5">Q: ${settings.faq2_q}</h4><p class="text-[11px] text-[var(--text-muted)] leading-relaxed"><span class="text-[var(--success)] font-black mr-1">A:</span> ${settings.faq2_a}</p></div>` : ''}</div><div class="mt-6 text-center border-t border-[var(--border-color)] pt-5"><p class="text-[10px] text-[var(--text-muted)] mb-2 uppercase tracking-wide" data-i18n="need_help">${t('need_help')}</p><button onclick="switchView('support')" class="cyan-btn px-4 py-3 rounded-xl text-xs font-black w-full shadow-[0_4px_15px_rgba(53,217,242,0.3)]"><i class="fa-solid fa-headset"></i> <span data-i18n="contact_sup">${t('contact_sup')}</span></button></div></div>`;
        }

        function renderSupport() {
            if(state.activeTicketId) return renderActiveTicket(state.activeTicketId, 'user');
            
            let myTickets = tickets.filter(t => t.userId === currentUser.id);
            let tk = myTickets.length > 0 ? myTickets[0] : null;
            
            if(!tk) {
                // Auto-create live chat instance
                let newId = currentUser.id;
                tk = { id: newId, userId: currentUser.id, userName: currentUser.name, subject: 'Live Chat Support', status: 'open', time: new Date().toLocaleString(), messages: [] };
                state.activeTicketId = newId;
                return renderActiveTicket(newId, 'user', tk);
            } else {
                state.activeTicketId = tk.id;
                return renderActiveTicket(tk.id, 'user');
            }
        }

        function renderActiveTicket(id, role = 'user', mockTk = null) {
            let tk = tickets.find(x=>x.id===id) || mockTk; 
            if(!tk) { state.activeTicketId=null; return renderApp(); }

            let msgHtml = '';
            if (tk.messages && tk.messages.length > 0) {
                msgHtml = tk.messages.map(m => {
                    let isMe = m.sender === role; 
                    let boxStyle = ""; let senderName = "";
                    if(isMe) {
                        if(role === 'admin') { boxStyle = "bg-white text-[var(--bg-main)] rounded-tl-xl rounded-tr-xl rounded-bl-xl border border-white shadow-lg"; senderName = "Me (Admin)"; } 
                        else { boxStyle = "bg-gradient-to-r from-[var(--bg-sidebar)] to-[var(--bg-card)] border border-[var(--border-color)] text-white rounded-tl-xl rounded-tr-xl rounded-bl-xl shadow-md"; senderName = "Me"; }
                    } else {
                        if(role === 'admin') { boxStyle = "bg-[var(--bg-card)] border border-[var(--border-color)] text-[var(--accent-cyan)] rounded-tl-xl rounded-tr-xl rounded-br-xl shadow-md"; senderName = tk.userName; } 
                        else { boxStyle = "bg-white text-[var(--bg-main)] rounded-tl-xl rounded-tr-xl rounded-br-xl shadow-[0_0_15px_rgba(255,255,255,0.1)]"; senderName = `<i class="fa-solid fa-headset text-[var(--accent-cyan)]"></i> Support Admin`; }
                    }
                    return `<div class="flex flex-col mb-4 w-[85%] ${isMe ? 'self-end' : 'self-start'}"><span class="text-[9px] text-[var(--text-muted)] font-bold mb-1 ${isMe ? 'text-right' : 'text-left'}">${senderName}</span><div class="p-3.5 ${boxStyle}"><p class="text-xs font-bold leading-relaxed">${m.text}</p></div><span class="text-[8px] text-[var(--text-muted)] mt-1 ${isMe ? 'text-right' : 'text-left'} bg-[var(--bg-main)] px-1.5 py-0.5 rounded inline-block ${isMe?'ml-auto':''}">${m.time}</span></div>`;
                }).join('');
            } else {
                msgHtml = `<div class="flex-1 flex flex-col items-center justify-center text-[var(--text-muted)] opacity-50 h-full"><i class="fa-solid fa-comments text-5xl mb-3"></i><p class="text-xs font-bold text-center px-4">যেকোনো সমস্যা অথবা বিষয়ে অ্যাডমিনের সাথে কথা বলতে নিচে মেসেজ লিখুন।</p></div>`;
            }

            let replyBox = `<div class="mt-4 pt-4 border-t border-[var(--border-color)] flex gap-2 relative"><input type="text" id="tk-reply" class="w-full input-premium p-3.5 pr-14 rounded-xl text-sm focus:border-[var(--accent-cyan)] shadow-inner" placeholder="${role==='admin'?'Admin reply...':'Write your message...'}" onkeypress="if(event.key==='Enter') replyTicket('${tk.id}', '${role}')"><button onclick="replyTicket('${tk.id}', '${role}')" class="absolute right-2 top-1/2 -translate-y-1/2 text-[var(--bg-main)] bg-gradient-to-br from-[var(--accent-cyan)] to-[#1a9bb0] w-10 h-10 hover:shadow-lg rounded-lg transition flex items-center justify-center shadow-md active:scale-90"><i class="fa-solid fa-paper-plane"></i></button></div>`;
            
            let headerInfo = '';
            if(role === 'admin') {
                let u = users.find(x => x.id === tk.userId) || { name: tk.userName, username: 'unknown', profilePic: '' };
                let dp = u.profilePic || `https://placehold.co/100x100/122B45/35D9F2?text=${u.name.substring(0,1).toUpperCase()}`;
                headerInfo = `<div class="flex items-center gap-3"><img src="${dp}" class="w-10 h-10 rounded-full border-2 border-[var(--accent-gold)] object-cover shadow-sm"><div><h2 class="text-sm font-black text-white">${u.name}</h2><p class="text-[9px] text-[var(--accent-cyan)] font-mono">@${u.username}</p></div></div><button onclick="markAdminChatDone('${tk.id}')" class="ml-auto bg-[var(--bg-main)] text-[var(--success)] hover:bg-[var(--success)] hover:text-white px-3 py-1.5 rounded-lg border border-[var(--success)]/30 text-[10px] font-black transition"><i class="fa-solid fa-check-double"></i> Mark Done</button>`;
            } else {
                headerInfo = `<h2 class="text-lg font-black text-white"><i class="fa-solid fa-headset text-[var(--accent-cyan)]"></i> Support Center</h2>`;
            }

            return `<div class="mb-4 flex items-center gap-3 bg-[var(--bg-sidebar)] p-3 rounded-xl border border-[var(--border-color)] shadow-sm"><button onclick="${role==='admin'?'state.activeTicketId=null; renderApp()':'switchView(\'home\')'}" class="bg-[var(--bg-main)] w-8 h-8 rounded-full border border-[var(--border-color)] text-[var(--text-muted)] hover:text-white flex items-center justify-center transition active:scale-90"><i class="fa-solid fa-arrow-left"></i></button>${headerInfo}</div><div class="glass-panel p-4 rounded-3xl flex flex-col h-[70vh] shadow-xl relative overflow-hidden"><div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(var(--accent-cyan) 1px, transparent 1px); background-size: 20px 20px;"></div><div class="flex-1 overflow-y-auto hide-scroll flex flex-col pr-1 relative z-10" id="chat-box">${msgHtml}</div><div class="relative z-10">${replyBox}</div></div>`;
        }

        async function replyTicket(id, sender) {
            let msg = document.getElementById('tk-reply').value.trim(); if(!msg) return;
            let tk = tickets.find(x=>x.id===id); 
            
            if(!tk) {
                // New user message
                tk = { id: id, userId: currentUser.id, userName: currentUser.name, subject: 'Live Chat Support', status: 'open', time: new Date().toLocaleString(), messages: [] };
                tk.messages.push({ sender: sender, text: msg, time: new Date().toLocaleString() });
                await db.collection('cb_tickets').doc(tk.id).set(tk);
            } else {
                tk.messages.push({ sender: sender, text: msg, time: new Date().toLocaleString() });
                await db.collection('cb_tickets').doc(tk.id).update({ messages: tk.messages, status: sender === 'user' ? 'open' : 'replied', lastUpdated: Date.now() });
            }

            if(sender === 'admin') await addNotification(tk.userId, "Support Reply", `Admin replied to your message.`, "info");
            document.getElementById('tk-reply').value = '';
            setTimeout(() => { let box = document.getElementById('chat-box'); if(box) box.scrollTop = box.scrollHeight; }, 50);
        }

        async function markAdminChatDone(id) {
            let tk = tickets.find(x=>x.id===id); 
            if(tk) { 
                await db.collection('cb_tickets').doc(tk.id).update({ status: 'closed' }); 
                showToast("Chat Marked as Done"); 
                state.activeTicketId = null;
                renderApp();
            }
        }
    </script>
</body>
</html>
